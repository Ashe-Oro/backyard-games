<!doctype html><meta charset="utf-8"><title>Cabinet spinner and P1 legends</title><style>body{margin:0;background:radial-gradient(ellipse at 50% 25%,#456a4d,#173f3d);height:100vh}#arcade-ui{position:fixed;inset:0}/* P1 panel: raised middle pair, level bottom row; confined to the lower right. */
#arcade-keys{position:absolute;right:16px;bottom:12px;width:288px;box-sizing:border-box;padding:10px;background:#141c22f2;border:1px solid #657078;border-radius:12px;color:#fff1cf;font: bold 12px/1.3 system-ui,sans-serif;pointer-events:auto}
.keys-status{display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:11px}
#arcade-keys-toggle{font:inherit;color:#ffe16b;background:#29363d;border:1px solid #769184;border-radius:4px;padding:5px 8px;cursor:pointer}
#arcade-keys-toggle:focus-visible{outline:2px solid #ffe16b}
.keys-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 3px;padding-top:18px;text-align:center}
.keys-button{display:grid;justify-items:center;gap:4px}
.keys-button:nth-child(2),.keys-button:nth-child(3){transform:translateY(-9px)}
.keys-button i{display:block;width:38px;height:38px;border-radius:50%;border:3px solid #ee241c;background:radial-gradient(ellipse at 32% 20%,#ffb09a 0,#ff3a28 8%,#db0906 32%,#a30000 68%,#ff2315 76%,#710000 90%);box-shadow:0 3px 3px #000,inset 0 0 4px #ff8970}
.keys-button b{font-size:11px;font-weight:700}
#arcade-keys #arcade-reset-bag{display:block;margin:8px 0 0 auto;border:0;padding:3px;font:10px system-ui,sans-serif}
#arcade-keys[data-tucked=true]{width:auto;padding:4px 6px}
#arcade-keys[data-tucked=true] .keys-status>span{display:none}
#arcade-keys [hidden]{display:none!important}
@media(max-height:600px){#arcade-keys{right:10px;bottom:8px;width:256px;padding:7px}.keys-button i{width:30px;height:30px}.keys-buttons{gap:7px 2px}.keys-button b{font-size:10px}}

/* Below the board close-up, outside the central throw lane. */
#arcade-spinner{position:absolute;left:16px;bottom:16px;padding:10px 14px;background:#141c22f2;border:1px solid #657078;border-radius:10px;color:#fff1cf;font:bold 18px/1.5 system-ui,sans-serif;pointer-events:none}
</style><div style="position:absolute;top:20px;left:38%;color:#fff1cf;font:bold 24px system-ui;text-align:center">BACKYARD CORNHOLE<br><small>RED 0 · BLUE 0</small></div><div style="position:absolute;left:42%;top:24%;width:16%;height:48%;background:repeating-linear-gradient(90deg,#c69a61 0px,#dfb781 30px,#d5a66b 33px);border:6px solid #a77243;transform:perspective(500px) rotateX(25deg);box-shadow:0 24px 15px #0007"><div style="position:absolute;top:12%;left:36%;width:28%;aspect-ratio:1;border-radius:50%;background:#172c25;box-shadow:0 0 0 4px #fff1cf"></div></div><div id="arcade-ui" style="pointer-events:none"><aside id="arcade-spinner" aria-label="Spinner legend"><div>A ↻ spin</div><div>C ↺ spin</div><div>1 ← aim</div><div>3 → aim</div></aside><aside id="arcade-keys" aria-label="P1 button legend"><div class="keys-status"><span id="arcade-state">↑</span><span id="arcade-height">NORMAL</span><span id="arcade-surface">SLICK</span><button id="arcade-keys-toggle" aria-expanded="true" aria-controls="arcade-keys-map">KEYS</button></div><div id="arcade-keys-map"><div class="keys-buttons"><span class="keys-button"><i aria-hidden="true"></i><b>HEIGHT</b></span><span class="keys-button"><i aria-hidden="true"></i><b>SURFACE</b></span><span class="keys-button"><i aria-hidden="true"></i><b>RESET</b></span><span class="keys-button"><i aria-hidden="true"></i><b>KEYS</b></span><span class="keys-button"><i aria-hidden="true"></i><b>LEFT</b></span><span class="keys-button"><i aria-hidden="true"></i><b>RIGHT</b></span><span class="keys-button"><i aria-hidden="true"></i><b>RESET</b></span><span class="keys-button"><i aria-hidden="true"></i><b>KEYS</b></span></div><button id="arcade-reset-bag">RESET BAG</button></div></aside></div>
