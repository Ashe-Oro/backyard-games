<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#163f3c"><title>Ladder Golf · Backyard Games</title><meta name="description" content="Play Ladder Golf solo, vs CPU or with a friend."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><link rel="stylesheet" href="/yard-games/style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"}}</script></head>
<body data-game="ladder-golf"><main id="game"><div id="hud" hidden><button id="pause-button" aria-label="Pause / menu">Ⅱ PAUSE</button><div class="heading"><span id="mode-label"></span><strong id="turn-label"></strong><span id="round-label"></span></div><div id="scoreboard"><div class="red">RED<strong id="red-score">0</strong><span id="red-pips"></span></div><div class="blue">BLUE<strong id="blue-score">0</strong><span id="blue-pips"></span></div></div><div id="practice-stats"></div><div id="message" role="status"></div><button id="clear" hidden>CLEAR TARGET</button><svg id="aim" aria-hidden="true"><defs><marker id="arrow-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path id="arrow-tip-fill" data-power-tip d="M1 1L9 5L1 9L3 5Z" fill="#ffe16b" stroke="#172c32"/></marker></defs><line id="tether" stroke="#fff1cf" stroke-width="2" stroke-dasharray="5 5"/><circle id="grip" data-power-grip r="10" fill="#ffe16b" stroke="#172c32" stroke-width="3"/><line id="power-track" data-power-track stroke="#fff1cf" stroke-width="3" opacity=".28"/><circle id="power-limit" data-power-limit r="3" fill="#fff1cf" opacity=".55"/><line id="arrow-shadow" stroke="#172c32" stroke-width="8"/><line id="arrow" data-power-shaft stroke="#ffe16b" stroke-width="4" marker-end="url(#arrow-tip)"/></svg></div>
<section id="menu" class="card"><a class="home-link" href="/">← ALL BACKYARD GAMES</a><p class="tag">Wrap the rungs.</p><h1>Ladder Golf</h1><div class="mode-buttons"><button data-mode="practice">SOLO PRACTICE<small>Unlimited throws.</small></button><button data-mode="cpu">VS CPU<small>Play the computer.</small></button><button data-mode="two">2 PLAYER<small>Pass and play.</small></button></div><label id="bonus-option" hidden><input type="checkbox" id="bonus"> 1-point ladder bonus</label><button id="rules-button" class="secondary">HOW TO PLAY</button></section>
<dialog id="rules" class="card"><h2>How to play</h2><p>Drag sideways to line up.<br>Pull down for power; diagonally to aim the opposite way.<br>Release to throw. Return to start to cancel.</p><p id="rules-copy"></p><a id="rules-source" target="_blank" rel="noopener">Full rules ↗</a><button id="rules-done">LET’S PLAY</button></dialog>
<dialog id="pause" class="card"><h2>Paused</h2><button id="resume">RESUME</button><button id="pause-rules" class="secondary">HOW TO PLAY</button><button id="pause-menu" class="secondary">MAIN MENU</button></dialog>
<dialog id="handoff" class="card"><p>PASS THE DEVICE</p><h2 id="handoff-title"></h2><p id="handoff-copy"></p><button id="ready">READY</button><button id="handoff-menu" class="secondary">MAIN MENU</button></dialog>
<dialog id="round-result" class="card"><p id="round-tag"></p><h2 id="result-title"></h2><p id="result-copy"></p><button id="next">NEXT ROUND</button><button id="result-menu" class="secondary">MAIN MENU</button></dialog><div id="error" hidden>WebGL unavailable. Try Chrome or Safari.</div></main><script type="module" src="/yard-games/engine.js"></script></body></html>
