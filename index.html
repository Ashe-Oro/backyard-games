function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

{

const clouds = [];
{

// ---------- ground ----------
{
  const grass = pixTex(32, 32, (g, w, h) => {

  }, [24, 24]);

  const fc = ['#ffffff', '#ffe45e', '#ff8fb6', '#ffffff', '#b98cff'];

// ---------- fence ----------
{

    for (let y = 0; y < 16; y++) for (let x = 0; x < 4; x++) px(g, x, y, pick(['#e0a96b', '#d89f60', '#e6b376']));

  const pickets = [];
  const addRun = (x0, z0, x1, z1) => {

  for (const y of [0.35, 1.0]) {
    box(15, 0.09, 0.05, rail, 0, y, -12.86, scene);
    box(0.05, 0.09, 15.8, rail, -7.56, y, -4.9, scene);
    box(0.05, 0.09, 15.8, rail, 7.56, y, -4.9, scene);

// ---------- trees, houses, bushes ----------
const leafMats = ['#3f9b3a', '#4fb246', '#2f8235', '#5cc24f', '#46a83f'].map(c => lam({ color: c, flatShading: true }));

function tree(x, z, s) {

  const n = 5 + Math.floor(R() * 3);
  for (let i = 0; i < n; i++) {
    const b = 1.2 + R() * 1.2;
    box(b * s, b * 0.8 * s, b * s, pick(leafMats), (R() - 0.5) * 1.6 * s, (2.2 + R() * 1.8) * s, (R() - 0.5) * 1.6 * s, g);

[[-11, -16, 1.1], [-5.5, -18.5, 1.3], [1.5, -20, 1.0], [6.5, -17, 1.2], [12, -18, 1.2], [-13, -9, 1.2], [13, -6, 1.1], [-12, -1, 1.0], [12.5, -13, 1.0], [-2.5, -25, 1.5], [9, -27, 1.3]].forEach(t => tree(...t));

const clock = new THREE.Clock();
let acc = 0, time = 0;
const lookTmp = new THREE.Vector3(), camTmp = new THREE.Vector3();
const CAM_LOOK = new THREE.Vector3(0, 0.5, -8.7);
camera.userData.look = CAM_LOOK.clone();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  if (keyAim && humanTurn()) M.aim = clamp(M.aim + keyAim * dt * 0.12, -AIM_MAX, AIM_MAX);
  if (flick && performance.now() - lastMoveT > 60) finishFlick();
  if (M.phase === 'cpu') {
    const c = M.cpu; c.t += dt;
    M.aim += (c.aim - M.aim) * Math.min(1, dt * 3);
    if (c.t > 0.7) setMeter(Math.min(c.power, (c.t - 0.7) / 0.5 * c.power));
    if (c.t > 1.3) throwBag(c.power, c.drift, 1);
  }
  acc += dt;
  while (acc >= 1 / 240) {
    acc -= 1 / 240;
    for (const b of bags) if (b.state !== 'in' && b.state !== 'removed' && !(b.state === 'grass' && !b.dead) && b.state !== 'board') step(b, 1 / 240);
    collide(bags);
  }
  if (M.phase === 'flying' && M.active && settled()) afterThrow();
  if (M.phase === 'settle' && settled()) scoreInning();
  for (const b of bags) {
    const m = b.mesh; m.position.copy(b.p);
    if (b.state === 'fly') { m.rotation.y += b.spin * dt; m.rotation.x = Math.sin(b.t * b.tumble) * 0.25; m.rotation.z = Math.cos(b.t * b.tumble * 0.7) * 0.15; }
    else if (onDeck(b) || b.state === 'hole') { const yaw = b.yaw ?? (b.yaw = m.rotation.y); if (b.state === 'slide') b.yaw += b.spin * dt * 0.3; m.quaternion.copy(boardQ); m.rotateY(b.yaw); }
    else if (b.state === 'ground' || b.state === 'grass') { m.rotation.x = 0; m.rotation.z = 0; }
    m.visible = b.state !== 'in' && b.state !== 'removed';
    if (b.state === 'slide') b.spin *= Math.pow(0.1, dt);
  }
  // camera stands behind whoever is throwing
  const t = thrower(), rx = RX[t] + M.position[t];
  const showHeld = M.phase === 'aim' || M.phase === 'cpu';
  const yaw = baseYaw(rx) + M.aim;
  held.visible = showHeld;
  if (showHeld) { held.position.set(rx + Math.sin(time * 2) * 0.004, REL_Y + Math.sin(time * 3) * 0.01, REL_Z); held.rotation.set(0.15, -yaw, 0); }
  aimDots.forEach((d, i) => {
    const dist = 1.6 + i * 0.5;
    d.position.set(rx + Math.sin(yaw) * dist, 0.012, REL_Z - Math.cos(yaw) * dist);
    d.visible = showHeld && isHuman(t);
    d.material.opacity = 0.35 + 0.4 * (0.5 + 0.5 * Math.sin(time * 6 - i * 0.6));
  });
  const camRx = M.phase === 'menu' ? 0.3 : rx;
  camTmp.set(camRx * 0.85 + M.aim * 2, 2.05, 1.4);
  camera.position.lerp(camTmp, Math.min(1, dt * 3));
  const fb = M.active && M.active.state === 'fly' ? M.active.p : null;
  lookTmp.copy(CAM_LOOK); lookTmp.x += M.aim * 6; if (fb) lookTmp.lerp(fb, 0.1);
  camera.userData.look.lerp(lookTmp, Math.min(1, dt * 3)); camera.lookAt(camera.userData.look);
  for (const c of clouds) { c.position.x += dt * 0.35; if (c.position.x > 50) c.position.x = -50; }
  for (const bl of bulbs) bl.gl.material.opacity = 0.5 + 0.25 * Math.sin(time * 2 + bl.ph);
  dog.tail.rotation.y = Math.sin(time * (M.phase === 'flying' ? 18 : 7)) * 0.6;
  const watch = M.active ? M.active.p : HOLE_WORLD;
  const dl = dog.g.worldToLocal(watch.clone()); const want = clamp(Math.atan2(-dl.x, -dl.z) * 0.6, -0.7, 0.7);
  dog.head.rotation.y += (want - dog.head.rotation.y) * Math.min(1, dt * 5);
  dog.head.position.y = 0.55 + Math.abs(Math.sin(time * 1.5)) * 0.008;
  for (const s of smoke) { s.t = (s.t + dt * 0.25) % 1; s.b.position.set(-5.2 + Math.sin(s.t * 6 + 1) * 0.15, 1.25 + s.t * 1.6, -9.6 + s.t * 0.3); s.b.material.opacity = 0.55 * (1 - s.t); s.b.scale.setScalar(0.6 + s.t * 1.4); }
  for (const c of confetti) if (c.life > 0) { c.life -= dt; c.v.y -= 6 * dt; c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += dt * 8; if (c.m.position.y < 0.02) { c.m.position.y = 0.02; c.v.set(0, 0, 0); } if (c.life <= 0) c.m.visible = false; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
hint(); setMeter(0);
if (POSTER) {
  for (const [team, lx, lz, st] of [[0, 0.12, -0.6, 'board'], [1, -0.15, -0.35, 'board'], [1, 0.16, -0.95, 'board'], [0, 0.02, -1.0, 'in']]) {
    const b = newBody(team); b.mesh = makeBagMesh(team, 'slick'); b.lp.set(lx, BAG_H, lz); toWorld(b.lp, b.p); b.state = st; b.yaw = Math.random() * 3; bags.push(b);
  }
  M.phase = 'poster'; M.scores = [17, 12]; M.inning = 6; renderHud();
  for (const el of [ui.hint, document.querySelector('.btns'), $('meter')]) el.style.display = 'none';
} else showMenu();
requestAnimationFrame(frame);

window.__game = {
  get state() { return { phase: M.phase, vs: M.vs, exact: M.exact, inning: M.inning, scores: [...M.scores], first: M.first, k: M.k, thrower: thrower(), aim: M.aim, position: [...M.position], spin: M.spin, arc: M.arc, wind: {...wind}, lastPower: M.lastPower, history: M.history.map((h) => ({ ...h })), winner: M.winner, bags: bags.map((b) => ({ team: b.team, state: b.state, dead: b.dead, side: b.side, p: b.p.toArray(), lp: b.lp.toArray(), velocity: b.lv.toArray() })) }; },
  win: WIN, flick: { min: FLICK_MIN, max: FLICK_MAX },
  startMatch, advance, lie: () => lie(),
  throwWith: (p, d = 0) => throwBag(p, d),
  setAim: (a) => { M.aim = a; },
  // test hooks: drop a resting bag on the deck (board-local metres, z negative toward the back), or preset the match score
  _place: (team, lx, lz) => { const b = newBody(team); b.mesh = makeBagMesh(team, 'slick'); b.lp.set(lx, BAG_H, lz); toWorld(b.lp, b.p); b.state = 'board'; b.touched = true; bags.push(b); renderHud(); },
  _setScores: (a, c) => { M.scores = [a, c]; renderHud(); },
  _probe: (power, arc, spin) => { const b = newBody(0); launch(b,RX[0],power,0,0,arc,spin); let flight=0; for(let i=0;i<1920;i++){step(b,1/240); if(b.state==='fly') flight+=1/240; if(['board','grass','in','removed'].includes(b.state))break;} return {p:b.p.toArray(),state:b.state,flight}; },
  _slide: (x,z,vx,vz) => { const b=newBody(0); b.mesh=makeBagMesh(0,'slick'); b.lp.set(x,BAG_H,z); b.lv.set(vx,0,vz); b.state='slide'; b.touched=true; toWorld(b.lp,b.p); bags.push(b); },
  holeLocalZ: HOLE_LOCAL.z,
};
</script>
