<script type="module">
import * as THREE from 'three';

// ---------- constants (regulation ACL/ACA dimensions, metres) ----------
const G = 9.8;

const RX = [0, 0];                         // both teams release along the centered bag's line
const TEAM = ['RED', 'BLUE'];
const HOLE_WORLD = new THREE.Vector3();

const params = new URLSearchParams(location.search);
const POSTER = params.has('poster');

// ---------- utils ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m); return m;
}

// ---------- renderer ----------
const wrap = document.getElementById('game');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
wrap.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#ffd3a8', 26, 75);
const camera = new THREE.PerspectiveCamera(19, 1, 0.1, 200);
const CAM_POS = new THREE.Vector3(0, 3.6, 8);
const CAM_PORTRAIT_POS = new THREE.Vector3(0, 2.6, 4);
const CAM_LOOK = new THREE.Vector3(0, 0.5, -8.7);
camera.position.copy(CAM_POS); camera.lookAt(CAM_LOOK);
camera.userData.look = CAM_LOOK.clone();
let meterLayoutDirty = true;

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const scale = Math.max(1, Math.round(Math.min(h, w * 0.85) / 310));
  renderer.setSize(Math.ceil(w / scale), Math.ceil(h / scale), false);
  camera.aspect = w / h;
  // Frame the real release point and board together, without a screen-space bag.
  const portrait = clamp((1.2 - camera.aspect) / 0.65, 0, 1);
  camera.position.copy(CAM_POS).lerp(CAM_PORTRAIT_POS, portrait);
  camera.lookAt(CAM_LOOK);
  camera.fov = 14 + 8 * portrait;
  camera.updateProjectionMatrix();
  meterLayoutDirty = true;
}
addEventListener('resize', resize); resize();

// ---------- lights ----------
scene.add(new THREE.HemisphereLight('#d6ecff', '#7a8f3a', 1.4));
const sun = new THREE.DirectionalLight('#ffe0b0', 2.6);
sun.position.set(-7, 12, 5); sun.target.position.set(0, 0, -5);

sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// ---------- sky ----------
{
  const g = new THREE.SphereGeometry(90, 24, 16);
  const cols = []; const c = new THREE.Color();
  const top = new THREE.Color('#3f7fe0'), mid = new THREE.Color('#9cc9ff'), low = new THREE.Color('#ffd09a'), hor = new THREE.Color('#ffb98a');
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 90;
    if (y > 0.35) c.copy(mid).lerp(top, (y - 0.35) / 0.65);
    else if (y > 0.08) c.copy(low).lerp(mid, (y - 0.08) / 0.27);
    else c.copy(hor).lerp(low, clamp((y + 0.1) / 0.18, 0, 1));
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(g, basic({ vertexColors: true, side: THREE.BackSide, fog: false })));
  // sun disk
  const sd = new THREE.Mesh(new THREE.CircleGeometry(4.2, 12), basic({ color: '#fff4c2', fog: false }));
  const halo = new THREE.Mesh(new THREE.CircleGeometry(6.5, 12), basic({ color: '#ffe39a', fog: false, transparent: true, opacity: 0.45 }));
  sd.position.set(-26, 13, -78); halo.position.set(-26, 13, -78.2); sd.lookAt(CAM_POS); halo.lookAt(CAM_POS);
  scene.add(halo, sd);
}
const clouds = [];
{
  const cw = basic({ color: '#ffffff', fog: false }), cp = basic({ color: '#ffd9e8', fog: false });
  const spots = [[-14, 17, -70], [12, 20, -74], [30, 15, -66], [-38, 22, -62], [4, 25, -80]];
  for (const [x, y, z] of spots) {
    const grp = new THREE.Group();
    const n = 4 + Math.floor(R() * 4);
    for (let i = 0; i < n; i++) {

}

function scoreInning() {

    M.first = scorer;                 // last scoring team throws first; a wash keeps the same order

    const u=(i%17)/16, row=Math.floor(i/17)/6;
    const along=.32*u*extension+.018*u*(1-extension);
    const ripple=Math.sin(seconds*frequency-u*11)*amplitude*u + .012*Math.sin(row*Math.PI*2)*u*(1-extension);
    pos.setXYZ(i,dx*along-dz*ripple,-.2*row*(1-.8*u)-.30*u*(1-extension),dz*along+dx*ripple);
  }
  pos.needsUpdate=true;pennant.geometry.computeVertexNormals();pennant.geometry.computeBoundingSphere();
  pennant.userData={extension,frequency,amplitude};
}

// ---------- loop ----------
const clock = new THREE.Clock();
let acc = 0, time = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  if (flick && performance.now() - lastMoveT > 60) finishFlick();
  if (M.phase === 'cpu') {
    const c = M.cpu; c.t += dt;
    M.aim += (c.aim - M.aim) * Math.min(1, dt * 3);
    if (c.t > 0.7) setMeter(Math.min(c.power, (c.t - 0.7) / 0.5 * c.power));
    if (c.t > 1.3) { M.aim=c.aim; throwBag(c.power, c.drift, 1); }
  }
  acc += dt;
  while (acc >= 1 / 240) {
    acc -= 1 / 240;
    for (const b of bags) if (b.state !== 'in' && b.state !== 'removed' && !(b.state === 'grass' && !b.dead) && b.state !== 'board') step(b, 1 / 240);
    collide(bags);
  }
  if (M.phase === 'flying' && M.active && settled()) afterThrow();
  if (M.phase === 'settle' && settled()) scoreInning();
  for (const b of bags) {
    const m = b.mesh; m.position.copy(b.p);
    if (b.state === 'fly') {
      m.rotation.y += b.spin * dt; m.rotation.x = Math.sin(b.t * b.tumble) * 0.25; m.rotation.z = Math.cos(b.t * b.tumble * 0.7) * 0.15;
      if (b.releaseQ && b.t < .16) m.quaternion.slerp(b.releaseQ, 1-b.t/.16);
    }
    else if (onDeck(b) || b.state === 'hole') { const yaw = b.yaw ?? (b.yaw = m.rotation.y); if (b.state === 'slide') b.yaw += b.spin * dt * 0.3; m.quaternion.copy(boardQ); m.rotateY(b.yaw); }
    else if (b.state === 'ground' || b.state === 'grass') { m.rotation.x = 0; m.rotation.z = 0; }
    // Soft cloth folds inward while passing through the six-inch opening.
    m.scale.setScalar(b.state === 'hole' ? .53 : 1);
    m.visible = b.state !== 'in' && b.state !== 'removed';
    if (b.state === 'slide') b.spin *= Math.pow(0.1, dt);
  }
  updateFlightTrail(dt);
  // The held bag and nearby power meter share the real release position.
  const t = thrower(), rx = releaseX(t);
  const showHeld = M.phase === 'aim' || M.phase === 'cpu';
  const yaw = baseYaw(rx) + M.aim;
  held.visible = showHeld;
  if (showHeld) positionHeldBag(yaw);
  if (meterLayoutDirty) positionPowerMeter();
  for (const c of clouds) { c.position.x += dt * 0.35; if (c.position.x > 50) c.position.x = -50; }
  for (const bl of bulbs) bl.gl.material.opacity = 0.5 + 0.25 * Math.sin(time * 2 + bl.ph);
  dog.tail.rotation.y = Math.sin(time * (M.phase === 'flying' ? 18 : 7)) * 0.6;
  const watch = M.active ? M.active.p : HOLE_WORLD;
  const dl = dog.g.worldToLocal(watch.clone()); const want = clamp(Math.atan2(-dl.x, -dl.z) * 0.6, -0.7, 0.7);
  dog.head.rotation.y += (want - dog.head.rotation.y) * Math.min(1, dt * 5);
  dog.head.position.y = 0.55 + Math.abs(Math.sin(time * 1.5)) * 0.008;
  for (const s of smoke) { s.t = (s.t + dt * 0.25) % 1; s.b.position.set(-5.2 + Math.sin(s.t * 6 + 1) * 0.15, 1.25 + s.t * 1.6, -9.6 + s.t * 0.3); s.b.material.opacity = 0.55 * (1 - s.t); s.b.scale.setScalar(0.6 + s.t * 1.4); }
  for (const c of confetti) if (c.life > 0) { c.life -= dt; c.v.y -= 6 * dt; c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += dt * 8; if (c.m.position.y < 0.02) { c.m.position.y = 0.02; c.v.set(0, 0, 0); } if (c.life <= 0) c.m.visible = false; }
  for (const c of boardDust) if (c.life>0) {
    c.life=Math.max(0,c.life-dt); c.v.y-=2*dt; c.m.position.addScaledVector(c.v,dt);
    c.m.material.opacity=.7*c.life/.4; c.m.visible=c.life>0;
  }
  animatePennant(time);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
hint(); setMeter(0);
if (POSTER) {
  for (const [team, lx, lz, st] of [[0, 0.12, -0.6, 'board'], [1, -0.15, -0.35, 'board'], [1, 0.16, -0.95, 'board'], [0, 0.02, -1.0, 'in']]) {
    const b = newBody(team); b.mesh = makeBagMesh(team, 'slick'); b.lp.set(lx, BAG_H, lz); toWorld(b.lp, b.p); b.state = st; b.yaw = Math.random() * 3; bags.push(b);
  }
  M.phase = 'poster'; M.scores = [17, 12]; M.inning = 6; renderHud();
  for (const el of [$('bag-drawer'), $('meter')]) el.style.display = 'none';
} else showMenu();
requestAnimationFrame(frame);

window.__game = {
  get state() { return { practice:M.practice, practiceStats:{...M.practiceStats}, heights:[...M.heights], side:[...M.side], sweet:meterWindow(), phase: M.phase, vs: M.vs, exact: M.exact, inning: M.inning, scores: [...M.scores], first: M.first, k: M.k, thrower: thrower(), aim: M.aim, position: [...M.position], spin: M.spin, arc: M.arc, wind: {...wind}, lastPower: M.lastPower, history: M.history.map((h) => ({ ...h })), winner: M.winner, bags: bags.map((b) => ({ team: b.team, state: b.state, dead: b.dead, side: b.side, p: b.p.toArray(), lp: b.lp.toArray(), velocity: b.lv.toArray() })) }; },
  _setWind:(mph,angle)=>{wind.mph=mph;wind.angle=angle;wind.x=Math.sin(angle)*mph*.025;wind.z=-Math.cos(angle)*mph*.025;renderHud();},
  _flag:(seconds)=>{if(seconds!==undefined)animatePennant(seconds);return {...pennant.userData,vertices:Array.from(pennant.geometry.attributes.position.array)};},
  _screenPoint:(x,z)=>{const v=new THREE.Vector3(x,.2,z).project(camera);return {x:(v.x+1)*wrap.clientWidth/2,y:(1-v.y)*wrap.clientHeight/2};},
  get career(){return {...career,roster:roster.map(o=>({...o})),active:!!M.career};},
  careerMap, careerIntro,
  win: WIN, flick: { min: FLICK_MIN, max: FLICK_MAX },
  startMatch, advance, lie: () => lie(),
  throwWith: (p, d = 0) => throwBag(p, d),
  setAim: (a) => { M.aim = a; },
  // test hooks: drop a resting bag on the deck (board-local metres, z negative toward the back), or preset the match score
  _place: (team, lx, lz) => { const b = newBody(team); b.mesh = makeBagMesh(team, 'slick'); b.lp.set(lx, BAG_H, lz); toWorld(b.lp, b.p); b.state = 'board'; b.touched = true; bags.push(b); renderHud(); },
  _setScores: (a, c) => { M.scores = [a, c]; renderHud(); },
  _probe: (power, arc, spin) => { const b = newBody(0); launch(b,RX[0],power,0,0,arc,spin); let flight=0; for(let i=0;i<1920;i++){step(b,1/240); if(b.state==='fly') flight+=1/240; if(['board','grass','in','removed'].includes(b.state))break;} return {p:b.p.toArray(),state:b.state,flight}; },
  _slide: (x,z,vx,vz) => { const b=newBody(0); b.mesh=makeBagMesh(0,'slick'); b.lp.set(x,BAG_H,z); b.lv.set(vx,0,vz); b.state='slide'; b.touched=true; toWorld(b.lp,b.p); bags.push(b); },
  holeLocalZ: HOLE_LOCAL.z,
};
</script>
